[package]
name = "libtea-cli"
version = "0.2.3"
description = "The libtea command: discover, inspect and download CycloneDX Transparency Exchange API (TEA) artifacts with checksum checks"
readme = "README.md"
keywords = ["cyclonedx", "sbom", "tei", "transparency", "cli"]
categories = ["command-line-utilities"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage = "https://github.com/Mehrn0ush/libtea-rs"
# Published from 0.2.0 (docs/design/cli-publish.md). The tests read files
# from the repository (docs, scripts, workflows), so they stay out of the
# package; Cargo.lock is added by `cargo package` for `cargo install --locked`.
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[[bin]]
name = "libtea"
path = "src/main.rs"

# cargo-binstall: fetch the release archive instead of compiling
# (docs/installing.md). The names match scripts/package-release.py; the
# release_scripts test renders them against a packaged archive. binstall does
# not check SHA256SUMS or the attestation. The quick-install strategy is off:
# it would fetch a binary built by a third party, not by release.yml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/libtea-{ version }-{ target }.tar.gz"
bin-dir = "libtea-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/libtea-{ version }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
libtea-core.workspace = true
libtea-client = { workspace = true, features = ["signature-keys"] }
clap.workspace = true
anyhow.workspace = true
tokio.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio.workspace = true
wiremock.workspace = true
serde_json.workspace = true
url.workspace = true
sha2.workspace = true
base64.workspace = true
