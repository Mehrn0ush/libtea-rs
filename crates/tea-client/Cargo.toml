[package]
name = "libtea-client"
version = "0.2.0"
description = "Independent async Rust client for the CycloneDX Transparency Exchange API."
readme = "README.md"
keywords = ["cyclonedx", "sbom", "tei", "transparency", "bom"]
categories = ["api-bindings", "network-programming"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage = "https://github.com/Mehrn0ush/libtea-rs"
documentation = "https://docs.rs/libtea-client"
publish = true

[dependencies]
libtea-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
tokio.workspace = true
reqwest.workspace = true
tracing.workspace = true
futures-util.workspace = true
bytes.workspace = true
base64.workspace = true
flate2.workspace = true
ring = { workspace = true, optional = true }

[features]
# `signature::KeyVerifier`: raw Ed25519 and ECDSA P-256 detached signatures
# checked against public keys the caller supplies.
signature-keys = ["dep:ring"]

[dev-dependencies]
wiremock.workspace = true
tokio.workspace = true
serde_json.workspace = true
sha2.workspace = true

[package.metadata.docs.rs]
all-features = true
