[package]
name = "cdx-tea-core"
version = "0.1.0"
description = "Independent Rust types and protocol rules for the CycloneDX Transparency Exchange API. No network I/O."
readme = "README.md"
keywords = ["cyclonedx", "sbom", "tei", "transparency", "bom"]
categories = ["api-bindings", "parsing"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage = "https://github.com/Mehrn0ush/teaSDK"
documentation = "https://docs.rs/cdx-tea-core"
publish = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
uuid.workspace = true
# Direct pins so published consumers keep an MSRV-compatible IDNA/ICU stack.
idna.workspace = true
idna_adapter.workspace = true
semver.workspace = true
sha1.workspace = true
sha2.workspace = true
sha3.workspace = true
blake2.workspace = true
blake3.workspace = true
digest.workspace = true
base64.workspace = true
flate2.workspace = true

[dev-dependencies]
proptest.workspace = true
